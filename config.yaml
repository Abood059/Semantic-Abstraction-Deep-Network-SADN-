# SADN - تجربة الاختراع الحر (Free Invention)
num_layers: 3
num_nodes_per_layer: 5
num_output_sentences: 5

model_name: "mistralai/Mistral-7B-Instruct-v0.3"
use_4bit: true

temperature: 0.6                    # إبداع متوسط (ليس الصرامة القصوى)
max_new_tokens: 600
do_sample: true

db_path: "experiment_results.db"

prompt_template: |
  [INST] You are a creative writer. You will be given 5 sentences that come from different contexts.
  Your task is to write exactly 5 new sentences that are INSPIRED by the given ones. They can continue the thoughts, transform the style, or introduce related ideas. Be original but let the given sentences guide you.
  Output ONLY a JSON list of 5 strings. No other text. Do not explain.
  Example output: ["new sentence one", "new sentence two", "new sentence three", "new sentence four", "new sentence five"]
  
  The 5 given sentences:
  {sentences} [/INST]
  [
