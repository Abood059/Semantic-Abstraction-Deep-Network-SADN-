# إعدادات التوزيع
num_layers: 10
num_nodes_per_layer: 10

# إعدادات النموذج
model_name: "Qwen/Qwen2.5-1.5B-Instruct"  # يمكن تغييره بسهولة
use_4bit: false  # استخدم التكميم إذا أردت توفير الذاكرة
temperature: 0.7
max_new_tokens: 512

# قاعدة البيانات
db_path: "experiment_results.db"

# البرومبت الثابت (سيُملأ {sentences} تلقائيًا)
prompt_template: |
  أنتَ عقدة معالجة في شبكة دلالية. أمامك 10 جمل غير مترابطة ظاهريًا.
  مهمتك:
  1. اكتشف الرابط الدلالي الخفي (مفهوم جامع) بين هذه الجمل.
  2. اكتب 10 جمل جديدة تعبّر عن هذا الرابط، بحيث تكون كل جملة مستقلة وتطور الفكرة.
  **تعليمات مهمة**:
  - لا تذكر الجمل الأصلية مطلقًا.
  - استخدم قائمة مرقمة (1. 2. ... 10.) دون أي نص آخر قبلها أو بعدها.
  - كل جملة يجب أن تكون في سطر منفصل وتبدأ برقم متبوع بنقطة ومسافة.

  الجمل المعطاة:
  {sentences}
