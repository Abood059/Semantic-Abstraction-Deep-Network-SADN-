# إعدادات التوزيع
num_layers: 10
num_nodes_per_layer: 10

# إعدادات النموذج
model_name: "Qwen/Qwen2.5-7B-Instruct"
use_4bit: true   # تفعيل التكميم 4-bit

# يمكن الإبقاء على باقي الإعدادات كما هي
temperature: 0.9
max_new_tokens: 200   # زيادة بسيطة لأن النموذج الأكبر قد يكتب جملاً أطول

# إعدادات التوليد (محسّنة للسرعة والإبداع)
temperature: 0.9
max_new_tokens: 150
do_sample: true

# قاعدة البيانات
db_path: "experiment_results.db"

# البرومبت الجديد (دقيق جداً)
prompt_template: |
  سأعطيك 10 جمل عشوائية. ابحث عن رابط جوهري دقيق يجمعها، ثم اكتب 10 جمل جديدة تعبر عن هذا الرابط.
  القواعد:
  - كل جملة يجب أن تكون مستقلة ولا تشير إلى الجمل الأصلية.
  - اكتب الجمل في قائمة مرقمة (1. 2. ... 10.) دون أي نص آخر قبلها أو بعدها.
  الجمل:
  {sentences}
