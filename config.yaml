# ==============================================
# SADN - إعدادات التجربة لنموذج Llama 3
# ==============================================

# --- إعدادات التوزيع ---
num_layers: 3                     # ابدأ بـ 3 طبقات للاختبار، ثم ارفع إلى 10
num_nodes_per_layer: 10

# --- إعدادات النموذج ---
model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
use_4bit: true                    # تكميم 4-bit ليعمل على T4

# --- إعدادات التوليد ---
temperature: 0.7                  # توازن بين الإبداع والالتزام
max_new_tokens: 800               # مساحة كافية لـ 10 جمل JSON
do_sample: true

# --- قاعدة البيانات (مسار مضمون داخل مجلد المشروع) ---
# استخدم مسارًا نسبيًا أو مطلقًا داخل كولاب
db_path: "experiment_results.db"

# --- البرومبت المُحسَّن لـ Llama 3 ---
# ملاحظة: ينتهي ببداية دور المساعد ليجبر النموذج على الإكمال مباشرة
prompt_template: |
  <|begin_of_text|><|start_header_id|>system<|end_header_id|>
  أنت مستخرج بيانات دقيق. ستُعطى 10 جمل عشوائية. مهمتك: إيجاد الرابط الدلالي الجوهري بينها، ثم كتابة 10 جمل جديدة تعبر عنه.
  أجب **فقط** بقائمة JSON تحتوي على 10 نصوص بالضبط. لا تشرح. لا تضف نصاً قبل أو بعد. لا تستخدم علامات Markdown.
  مثال للإخراج الصحيح:
  ["الترابط بين الكائنات يظهر عبر أنماط مشتركة", "الاكتشافات العلمية تعتمد على الاستمرارية", "الفن يخلق جسوراً بين الحضارات", "الرياضيات لغة الطبيعة التي توحد الظواهر", "السفر يوسع آفاق المعرفة والتفاهم", "القراءة تفتح النوافذ على عوالم جديدة", "التكنولوجيا الحديثة تسهل التعاون العالمي", "الأخلاق تحكم تطور المجتمعات عبر العصور", "الفلسفة تبحث عن معنى الوجود المشترك", "الأحلام تشكل طاقة التغيير لدى البشر"]<|eot_id|><|start_header_id|>user<|end_header_id|>
  الجمل المعطاة:
  {sentences}<|eot_id|><|start_header_id|>assistant<|end_header_id|>
