# إعدادات التوزيع
num_layers: 3                     # اختبار أولي
num_nodes_per_layer: 10

# إعدادات النموذج (مفتوح، لا يحتاج مصادقة)
model_name: "mistralai/Mistral-7B-Instruct-v0.3"

# تفعيل التكميم 4-bit ليتسع في T4
use_4bit: true

# إعدادات التوليد
temperature: 0.7
max_new_tokens: 800
do_sample: true

# قاعدة البيانات
db_path: "experiment_results.db"

# البرومبت المحسّن (Mistral لا يحتاج tokens خاصة مثل Llama)
prompt_template: |
  [INST] أنت محلل دلالي دقيق. ستُعطى 10 جمل عشوائية. مهمتك: إيجاد الرابط الجوهري بينها وكتابة 10 جمل جديدة تعبر عنه.
  أجب **فقط** بقائمة JSON تحتوي على 10 نصوص بالضبط. لا تشرح. لا تضف أي كلام آخر.
  مثال للإخراج الصحيح:
  ["الجملة الأولى", "الجملة الثانية", "الجملة الثالثة", "الجملة الرابعة", "الجملة الخامسة", "الجملة السادسة", "الجملة السابعة", "الجملة الثامنة", "الجملة التاسعة", "الجملة العاشرة"]
  
  الجمل المعطاة:
  {sentences} [/INST]
