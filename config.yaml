# SADN - إعدادات التجربة الإنجليزية لـ Mistral
num_layers: 3                       # للاختبار الأولي
num_nodes_per_layer: 5              # 5 عقد في كل طبقة
num_output_sentences: 5             # عدد الجمل التي تنتجها كل عقدة (5)

model_name: "mistralai/Mistral-7B-Instruct-v0.3"
use_4bit: true

temperature: 0.6                    # التزام أعلى
max_new_tokens: 600                 # مساحة كافية لـ 5 جمل
do_sample: true

db_path: "experiment_results.db"

prompt_template: |
  [INST] You are a precise semantic analyst. You will be given 5 random sentences that appear unrelated.
  Your task: find the single deep thematic connection that ties them together, then write exactly 5 new sentences that express this connection.
  Output ONLY a JSON list of 5 strings. No other text. Do not explain.
  Example output: ["sentence one", "sentence two", "sentence three", "sentence four", "sentence five"]
  
  The 5 given sentences:
  {sentences} [/INST]
  [
