# إعدادات التوزيع
num_layers: 10
num_nodes_per_layer: 10

# إعدادات النموذج
model_name: "Qwen/Qwen2.5-1.5B-Instruct"  # يمكن تغييره
use_4bit: false

# إعدادات التوليد (محسّنة للسرعة والإبداع)
temperature: 0.9
max_new_tokens: 150
do_sample: true

# قاعدة البيانات
db_path: "experiment_results.db"

# البرومبت الجديد (دقيق جداً)
prompt_template: |
  أنت محلل دلالي دقيق. ستُعطى 10 جمل عشوائية لا يبدو بينها رابط واضح.
  مهمتك:
  1. فكر بهدوء: ما هو الرابط الجوهري الوحيد الذي يجمع هذه الجمل؟ (لا تكتب هذه الخطوة).
  2. أنتج 10 جمل جديدة تعبر عن هذا الرابط، بحيث تكون كل جملة مستقلة تماماً ولا تشير إلى الجمل الأصلية.

  قواعد صارمة:
  - أخرج قائمة JSON تحتوي بالضبط على 10 نصوص.
  - لا تكرر الجمل. لا تستخدم رموزاً مثل "__" أو أرقامًا مفردة.
  - لا تضف أي كلام آخر قبل القائمة أو بعدها.
  - مثال للإخراج المطلوب: ["الجملة الأولى", "الجملة الثانية", "الجملة الثالثة", "الجملة الرابعة", "الجملة الخامسة", "الجملة السادسة", "الجملة السابعة", "الجملة الثامنة", "الجملة التاسعة", "الجملة العاشرة"]

  الجمل المعطاة:
  {sentences}
