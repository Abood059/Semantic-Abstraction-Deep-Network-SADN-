# إعدادات التوزيع
num_layers: 3                     # ابدأ بـ 3 طبقات فقط للتحقق من اكتمال 10 جمل
num_nodes_per_layer: 10           # هذه ثابتة

# إعدادات النموذج
model_name: "Qwen/Qwen2.5-7B-Instruct"   # غيّره حسب كل جلسة
use_4bit: true                    # أساسي لتوفير VRAM

# إعدادات التوليد (حرية أكبر للإبداع)
temperature: 0.9
max_new_tokens: 600               # زيادة كبيرة: 600 رمز تكفي لـ 10 جمل بسهولة
do_sample: true

# قاعدة البيانات
db_path: "experiment_results.db"

# البرومبت الصارم الجديد
prompt_template: |
  سأعطيك 10 جمل عشوائية غير مترابطة.
  مهمتك:
  1. فكر: ما الرابط الجوهري الدقيق الذي يجمع بينها؟ (لا تذكر هذه الفكرة)
  2. اكتب 10 جمل جديدة تعبر عن هذا الرابط، بحيث تكون كل جملة مستقلة تمامًا ولا تشير إلى الجمل الأصلية.

  القواعد الصارمة (مخالفتها تعني فشل المهمة):
  - أخرج بالضبط 10 جمل مرقمة (من 1 إلى 10)، ولا شيء غيرها.
  - كل جملة في سطر منفصل، تبدأ برقمها متبوعًا بنقطة ومسافة.
  - لا تضف أي نص آخر قبل القائمة أو بعدها. لا تشرح. لا تعتذر. لا تقدم ملاحظات.

  مثال للإخراج المطلوب (اتبع نفس الهيكل):
  1. الترابط بين الكائنات يظهر عبر أنماط مشتركة.
  2. الاكتشافات العلمية تعتمد على الاستمرارية.
  3. الفن يخلق جسورًا بين الحضارات.
  4. الرياضيات لغة الطبيعة التي توحد الظواهر.
  5. السفر يوسع آفاق المعرفة والتفاهم.
  6. القراءة تفتح النوافذ على عوالم جديدة.
  7. التكنولوجيا الحديثة تسهل التعاون العالمي.
  8. الأخلاق تحكم تطور المجتمعات عبر العصور.
  9. الفلسفة تبحث عن معنى الوجود المشترك.
  10. الأحلام تشكل طاقة التغيير لدى البشر.

  الجمل المعطاة:
  {sentences}
